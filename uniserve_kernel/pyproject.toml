[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniserve-kernel"
version = "0.1.0"
description = "UniServe optional CUTE/Triton kernel provider pack"
requires-python = ">=3.10"
dependencies = [
  "flash-attn-4[cu13]==4.0.0b24",
  "nvidia-cutlass-dsl[cu13]==4.6.0.dev0",
  "torch>=2.8.0a0,<2.12",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["uniserve_kernel*"]

[tool.setuptools.package-data]
uniserve_kernel = ["py.typed", "_fa4_overlay/flash_attn/cute/*.py"]
