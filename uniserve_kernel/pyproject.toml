# Packages accelerator-specific kernels independently from the core runtime.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniserve-kernel"
version = "0.1.0"
description = "UniServe optional kernel provider pack"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.13,<2.14",
]

[project.optional-dependencies]
peer_storage = [
  "ninja>=1.13",
]
sparse_attention = [
    "ninja>=1.13",
]
flash_attn_jagged = [
  "flash-attn-4[cu13]==4.0.0b30",
  "nvidia-cutlass-dsl[cu13]==4.6.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["uniserve_kernel*"]

[tool.setuptools.package-data]
uniserve_kernel = ["py.typed", "sparse_attention/csrc/*.cu", "sparse_attention/csrc/*.cuh", "sparse_attention/LICENSE", "peer_storage/csrc/*.cpp"]
