# Packages accelerator-specific kernels independently from the core runtime.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniserve-kernel"
version = "0.1.0"
description = "UniServe optional kernel provider pack"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.13,<2.14",
]

[project.optional-dependencies]
flash_attn_jagged = [
  "flash-attn-4[cu13]==4.0.0b24",
  "nvidia-cutlass-dsl[cu13]==4.6.0.dev0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["uniserve_kernel*"]

[tool.setuptools.package-data]
uniserve_kernel = ["py.typed", "flash_attn_jagged/cute/*.py"]
