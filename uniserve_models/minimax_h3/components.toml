# One division per component, as `uniserve_models.components` reads them.
#
# A video is produced across every rank: the denoiser divides its sequence by
# attention head, the text encoder divides its tensors, and each decoder
# reconstructs and encodes its own media units of the output timeline. The
# muxer assembles those encoded units into the artifact on one host lane; it
# owns no numerical method, so it divides nothing.
denoiser = "sequence"
text_encoder = "tensor"
video_decoder = "media_units"
audio_decoder = "media_units"
muxer = "nothing"
