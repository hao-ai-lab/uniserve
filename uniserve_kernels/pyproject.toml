# Packages UniServe's device kernels independently from the computation
# library. The package build compiles the native extensions (setup.py);
# extras select optional kernel runtimes.
[build-system]
requires = ["setuptools>=68", "wheel", "ninja>=1.13"]
build-backend = "setuptools.build_meta"

[project]
name = "uniserve-kernels"
version = "0.1.0"
description = "UniServe device kernels"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.13,<2.14",
]

[project.optional-dependencies]
flash_attn_4 = [
  "flash-attn-4[cu13]==4.0.0b30",
  "nvidia-cutlass-dsl[cu13]==4.6.2",
]
# Fused expert-parallel kernels use the locked NVSHMEM Python/native pair.
megamoe = [
  "nvshmem4py-cu13==0.4.0",
  "nvidia-cutlass-dsl[cu13]==4.6.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["uniserve_kernels*"]

[tool.setuptools.package-data]
uniserve_kernels = ["py.typed", "attention/vsa_native/LICENSE", "megamoe/LICENSE"]

[tool.uv]
# Rebuild the compiled extensions when their sources or build target change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "src/**/*.cpp" },
  { file = "src/**/*.cu" },
  { file = "src/**/*.cuh" },
  { file = "src/**/*.h" },
  { env = "UNISERVE_KERNELS_DEVICE" },
  { env = "TORCH_CUDA_ARCH_LIST" },
]
