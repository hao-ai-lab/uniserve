# Packages UniServe's device kernels independently from the computation
# library. Extras select native extensions and their optional runtimes.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniserve-kernels"
version = "0.1.0"
description = "UniServe device kernels"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.13,<2.14",
]

[project.optional-dependencies]
peer_storage = [
  "ninja>=1.13",
]
sparse_attention = [
    "ninja>=1.13",
]
flash_attn_4 = [
  "flash-attn-4[cu13]==4.0.0b30",
  "nvidia-cutlass-dsl[cu13]==4.6.2",
]
# Fused expert-parallel kernels use the locked NVSHMEM Python/native pair.
megamoe = [
  "nvshmem4py-cu13==0.4.0",
  "nvidia-cutlass-dsl[cu13]==4.6.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["uniserve_kernels*"]

[tool.setuptools.package-data]
uniserve_kernels = ["py.typed", "csrc/*.cu", "attention/vsa_native/csrc/*.cu", "attention/vsa_native/csrc/*.cuh", "attention/vsa_native/LICENSE", "megamoe/LICENSE", "diffusion/*.json", "diffusion/csrc/*.cu", "diffusion/csrc/*.cpp", "peer_storage/csrc/*.cpp"]
