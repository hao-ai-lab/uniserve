[build-system]
requires = ["setuptools>=70", "wheel", "setuptools-rust>=1.7"]
build-backend = "setuptools.build_meta"

[project]
name = "uniserve"
version = "0.1.0"
description = "UniServe Python worker runtime with internal BAGEL and SenseNova backends. The Rust host/server is built with cargo."
readme = "README.md"
requires-python = ">=3.11"
# Keep the CUDA-13 PyTorch and torchvision release lines aligned. The locked
# Linux wheels bring their matching NCCL and NVSHMEM runtime dependencies.
dependencies = [
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
    "transformers>=4.57.1",
    "safetensors",
    "einops",
    "accelerate",
    "numpy",
    "pillow",
    "packaging<=25.0",
    "tqdm",
    "sentencepiece",
    "huggingface_hub",
    "diffusers>=0.36",
    "av>=14",
    "nccl4py==0.3.1; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Hub-hosted evaluation datasets (MJHQ-30K, UEval, ShareGPT, PIE-Bench, Beans).
eval-datasets = [
    "datasets>=3",
    "pyarrow<20",
]
test = [
    "coverage[toml]>=7.6",
    "jsonschema>=4.22",
    "pytest>=8.1",
    "pytest-rerunfailures>=14",
    "pytest-shard>=0.1",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
]
dev = [
    "build>=1.2",
    "markdown-it-py<4.0",
    "mypy>=1.11",
    "pyright>=1.1",
    "ruff>=0.6",
]
bench = [
    "datasets>=2.0",
    "httpx[socks]>=0.27",
    "pillow>=10.4",
]
# Optional accelerator kernels. Model bindings require their declared native
# capabilities at startup. UniServe kernels live in the independent
# `uniserve-kernel` pack. Shared dense and sparse providers use CuTe DSL;
# native builds require a CUDA 13 toolkit.
gpu = [
    "flashinfer-python==0.6.18",
    "ninja>=1.13",
    "requests[socks]>=2",
    "uniserve-kernel[peer_memory,flash_attn_jagged]",
]
h3 = [
    # H3 audio decoding and the default NVFP4/peer-transfer paths must work
    # when this extra is installed without the general GPU extra.
    "diffusers>=0.40",
    "flashinfer-python==0.6.18",
    "uniserve-kernel[peer_memory,sparse_attention,flash_attn_jagged]",
    "nvidia-cudnn-frontend[cutedsl]==1.27.0",
    "nvidia-cutlass-dsl[cu13]==4.6.2",
]

[tool.uv.sources]
uniserve-kernel = { path = "uniserve_kernel", editable = true }

[project.scripts]
uniserve-worker = "uniserve_worker.main:main"
uniserve-eval = "uniserve_eval.cli:main"

[tool.setuptools.packages.find]
# Optional UniServe kernels are packaged independently
# (`uniserve_kernel/pyproject.toml`) so the root worker distribution cannot mask
# a missing kernel install.
include = ["uniserve_worker*", "uniserve_eval*"]

[tool.setuptools.package-data]
uniserve_eval = ["profiles.toml"]

# Native worker IPC extension (PyO3).
[[tool.setuptools-rust.ext-modules]]
target = "uniserve_worker._uniserve_ipc"
path = "crates/worker-ipc-py/Cargo.toml"
binding = "PyO3"

# Server/scheduler binary, installed onto PATH as `uniserve`.
[[tool.setuptools-rust.bins]]
target = "uniserve"
path = "crates/bin/uniserve/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "unit: pure local tests without server, GPU, or external model files",
    "architecture: build-time dependency direction and package layout checks",
    "integration: multi-component tests using fake/simulated backends",
    "e2e: black-box server or worker tests",
    "gpu: requires real GPU model execution",
    "slow: excluded from the fast local and presubmit suites",
    "model(name): selects a concrete model backend such as sensenova or bagel",
    "sensenova: SenseNova-U1-specific test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "refs",
    "target",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
# Source of truth for the type-check scope. Must match the explicit paths
# passed by CI (.github/workflows/ci.yml) and the justfile `lint` target
# (`mypy uniserve_worker uniserve_eval`) so bare/editor invocations agree with CI.
files = ["uniserve_worker", "uniserve_eval"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Keep aligned with [tool.mypy].files and the CI/justfile type-check scope.
include = ["uniserve_worker", "uniserve_eval"]
exclude = ["refs", "target", ".venv"]
reportMissingImports = "warning"

[tool.coverage.run]
branch = true
source = ["uniserve_worker", "uniserve_eval"]

[tool.coverage.report]
show_missing = true
skip_covered = true
