name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo bench --workspace --no-run

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ./uniserve_kernels -e ".[dev,test,bench]"
      - run: python -m ruff check uniserve uniserve_models uniserve_worker uniserve_eval uniserve_kernels/src tests scripts
      - run: python -m ruff format --check uniserve uniserve_models uniserve_worker uniserve_eval uniserve_kernels/src tests scripts
      - run: python -m mypy uniserve uniserve_models uniserve_worker uniserve_eval
      - run: python -m pytest -m "unit and not gpu"
      - run: python -m pytest -m "integration and not gpu"

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e ./uniserve_kernels -e ".[test,bench]"
      - run: cargo build -p uniserve-cli
      - run: python -m pytest -m "e2e and not gpu"
