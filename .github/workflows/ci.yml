name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    # The hosted runner has no CUDA toolkit; the kernel package installs its
    # Python modules without compiling the native extensions.
    env:
      UNISERVE_KERNELS_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # etcd-client compiles its protocol definitions with protoc, and
      # nixl-sys generates its bindings through libclang.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The engine's multiprocess tests launch real worker ranks through the
      # repository's `.venv/bin/python`, and the IPC conversion tests import
      # the worker's Python packages from it, so cargo test needs the locked
      # environment.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12 --extra test
      - run: cargo test --workspace
      - run: cargo bench --workspace --no-run

  python:
    runs-on: ubuntu-latest
    # The hosted runner has no CUDA toolkit; the kernel package installs its
    # Python modules without compiling the native extensions.
    env:
      UNISERVE_KERNELS_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      # The sync builds the worker IPC extension and the server binaries.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Workspace packages such as uniserve-eval resolve through
      # `[tool.uv.sources]`, so the locked environment comes from uv.
      - run: uv sync --locked --python 3.12 --extra dev --extra test --extra bench
      - run: .venv/bin/python -m ruff check uniserve uniserve_models uniserve_worker uniserve_eval uniserve_kernels/src tests
      - run: .venv/bin/python -m ruff format --check uniserve uniserve_models uniserve_worker uniserve_eval uniserve_kernels/src tests
      - run: .venv/bin/python -m mypy uniserve uniserve_models uniserve_worker uniserve_eval
      - run: .venv/bin/python -m pytest -m "unit and not gpu"
      - run: .venv/bin/python -m pytest -m "integration and not gpu"
