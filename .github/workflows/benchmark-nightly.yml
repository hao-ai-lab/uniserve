name: Nightly GPU Benchmarks

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  sensenova:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test,bench,gpu]"
      - run: cargo build -p uniserve-cli
      - run: UNISERVE_RUN_GPU_E2E=1 python -m pytest -m "e2e and gpu and sensenova"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensenova-e2e-artifacts
          path: e2e-artifacts/
