[workspace]
resolver = "3"
members = [
    "crates/foundation/*",
    "crates/worker-ipc",
    "crates/worker-ipc-py",
    "crates/engine",
    "crates/server",
    "crates/bin/uniserve",
    "crates/bin/uniserve-host",
    "crates/bin/dynamo-worker",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
readme = "README.md"

[workspace.dependencies]
uniserve-core = { path = "crates/foundation/core" }
uniserve-observability = { path = "crates/foundation/observability" }
uniserve-observability-derive = { path = "crates/foundation/observability-derive" }
uniserve-worker-ipc = { path = "crates/worker-ipc" }
uniserve-engine = { path = "crates/engine" }
uniserve-server = { path = "crates/server" }

# ---- engine third-party deps ----
crossbeam-channel = "0.5"
sha2 = "0.10"

# ---- server third-party deps ----
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
arc-swap = "1.9.0"
asynk-strim-attr = "0.1.0"
# Dynamo currently pins 0.8.4 exactly, so the shared workspace range must include it.
axum = { version = "0.8.4", features = ["multipart"] }
base64 = "0.22.1"
bitflags = { version = "2.10.0", features = ["serde"] }
bytes = "1.11.1"
clap = { version = "4.5.38", features = ["derive", "env"] }
criterion = "0.5.1"
educe = "0.6.0"
expect-test = "1.5.1"
fastokens = "0.2.0"
flatbuffers = "=25.12.19"
futures = "0.3.31"
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "ureq", "rustls-tls"] }
http-body = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
indexmap = "2.13.0"
itertools = "0.14.0"
libc = "0.2.177"
libloading = "0.8.9"
llm-multimodal = { git = "https://github.com/vllm-project/llm-multimodal", rev = "5b558989844d1c7af3e43d0f604069ffd9c06320" }
mimalloc = "0.1.52"
minijinja = { version = "2.0", features = ["unstable_machinery", "json", "builtins", "loader", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2.0", features = ["pycompat"] }
proc-macro2 = "1.0.106"
prometheus-client = "0.24.0"
png = "0.18.1"
# `pyo3/extension-module` is injected by setuptools-rust when the wheel builds
# the `_uniserve_ipc` cdylib (see `_binding_features` for PyO3 bindings); it is
# deliberately NOT a workspace feature so `cargo test -p uniserve-ipc-py` can
# link libpython and run tests against an embedded interpreter.
pyo3 = { version = "0.29.0" }
pythonize = "0.29.0"
quote = "1.0.46"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde-json-fmt = "0.1.0"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_with = "3.18.0"
socket2 = "0.6.3"
syn = { version = "2.0.118", features = ["full"] }
tempfile = "3.23.0"
thiserror = "2.0.16"
thiserror-ext = "0.3.0"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
tokenizers = "0.22.0"
tokio = { version = "1.47.1", features = [
    "process",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.22.0", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
winnow = "1.0.2"
dynamo-backend-common = { git = "https://github.com/ai-dynamo/dynamo.git", rev = "c0de00088f032c18f159c01ec11058767902db4c" }
iceoryx2 = "0.9.2"
iceoryx2-bb-elementary-traits = "0.9.2"

# ---- build-time helpers ----
flatbuffers-build = "0.2.4"
flatc-fork = "0.6.0"

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
large_futures = "warn"
mem_forget = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[profile.dev]
panic = "abort"

[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"
