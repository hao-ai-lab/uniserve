[workspace]
resolver = "3"
members = [
    "crates/foundation/*",
    "crates/protocol/*",
    "crates/engine/*",
    "crates/frontend/*",
    "crates/server/*",
    "crates/bin/*",
    "crates/support/*",
]
# `crates/protocol/vocab/` holds the canonical cross-language vocabulary schema
# (data, not a crate); exclude it from the `crates/protocol/*` member glob.
exclude = ["crates/protocol/vocab"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
readme = "README.md"

[workspace.dependencies]
# ---- engine-tier crates ----
uniserve-core = { path = "crates/foundation/core" }
uniserve-config = { path = "crates/foundation/config" }
uniserve-observability = { path = "crates/foundation/observability" }
uniserve-observability-derive = { path = "crates/foundation/observability-derive" }
uniserve-worker-wire = { path = "crates/protocol/worker-wire" }
uniserve-worker-ipc-core = { path = "crates/protocol/worker-ipc-core" }
uniserve-engine-wire = { path = "crates/protocol/engine-wire" }
uniserve-grpc-proto = { path = "crates/protocol/grpc-proto" }
uniserve-openai-types = { path = "crates/protocol/openai-types" }
uniserve-engine-process = { path = "crates/engine/process" }
uniserve-engine-runtime = { path = "crates/engine/runtime" }
uniserve-engine-api = { path = "crates/protocol/engine-api" }
uniserve-executor = { path = "crates/engine/executor" }
uniserve-kv = { path = "crates/engine/kv" }
uniserve-scheduler = { path = "crates/engine/scheduler" }
uniserve-sim = { path = "crates/engine/sim" }
uniserve-worker-ipc = { path = "crates/engine/worker-ipc" }

# ---- frontend-tier crates ----
uniserve-chat = { path = "crates/frontend/chat" }
uniserve-chat-output = { path = "crates/frontend/chat-output" }
uniserve-chat-protocol = { path = "crates/frontend/chat-protocol" }
uniserve-chat-template = { path = "crates/frontend/chat-template" }
uniserve-engine-client = { path = "crates/frontend/engine-client" }
uniserve-engine-gateway = { path = "crates/frontend/engine-gateway" }
uniserve-llm = { path = "crates/frontend/llm" }
uniserve-model-profile = { path = "crates/frontend/model-profile" }
uniserve-model-assets = { path = "crates/frontend/model-assets" }
uniserve-native-api = { path = "crates/frontend/native-api" }
uniserve-openai-api = { path = "crates/frontend/openai-api" }
uniserve-protocol-adapters = { path = "crates/frontend/protocol-adapters" }
uniserve-reasoning-parser = { path = "crates/frontend/reasoning-parser" }
uniserve-serving = { path = "crates/frontend/serving" }
uniserve-text = { path = "crates/frontend/text" }
uniserve-tokenizer = { path = "crates/frontend/tokenizer" }
uniserve-tool-parser = { path = "crates/frontend/tool-parser" }
uniserve-managed-engine = { path = "crates/bin/managed-engine" }
uniserve-server-app = { path = "crates/server/app" }
uniserve-server-grpc = { path = "crates/server/grpc" }
uniserve-server-http = { path = "crates/server/http" }
uniserve-examples = { path = "crates/support/examples" }
uniserve-testkit = { path = "crates/support/testkit" }

# ---- engine-tier third-party deps ----
crossbeam-channel = "0.5"
sha2 = "0.10"

# ---- frontend-tier third-party deps ----
anyhow = "1.0.100"
arc-swap = "1.9.0"
async-openai = "0.33.1"
async-trait = "0.1.89"
asynk-strim-attr = "0.1.0"
axum = "0.8.8"
base64 = "0.22.1"
bytemuck = { version = "1.25.0", features = ["extern_crate_alloc"] }
byteorder = "1.5.0"
bytes = "1.11.1"
clap = { version = "4.5.38", features = ["derive", "env"] }
criterion = "0.5.1"
easy-ext = "1.0.3"
educe = "0.6.0"
enum-as-inner = "0.7.0"
expect-test = "1.5.1"
fastokens = "0.2.0"
flatbuffers = "=25.12.19"
futures = "0.3.31"
half = { version = "2.7.1", features = ["bytemuck"] }
hex = "0.4.3"
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "ureq", "rustls-tls"] }
http-body = "1.0.1"
indexmap = "2.13.0"
itertools = "0.14.0"
libc = "0.2.177"
llm-multimodal = { git = "https://github.com/vllm-project/llm-multimodal", rev = "5b558989844d1c7af3e43d0f604069ffd9c06320" }
mimalloc = "0.1.52"
minijinja = { version = "2.0", features = ["unstable_machinery", "json", "builtins", "loader", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2.0", features = ["pycompat"] }
native-tls-vendored = { package = "native-tls", version = "0.2.18", features = ["vendored"] }
ndarray = { version = "0.16.1", features = ["serde"] }
openai-harmony = "0.0.8"
openai-protocol = "1.6.0"
parking_lot = "0.12.5"
paste = "1.0.15"
proc-macro2 = "1.0.106"
prometheus-client = "0.24.0"
prometheus-client-derive-encode = "0.5.0"
png = "0.18.1"
prost = "0.14.3"
prost-types = "0.14.3"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
pythonize = "0.29.0"
quote = "1.0.46"
rand = "0.9.2"
reqwest = { version = "0.12.8", default-features = false, features = ["rustls-tls"] }
riptoken = { version = "0.3.0", default-features = false }
messagepack-serde = { package = "rmp-serde", version = "1.3.1" }
rmpv = { version = "1.3.1", features = ["with-serde"] }
rustc-hash = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-json-fmt = "0.1.0"
serde_default = "0.2.0"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_repr = "0.1.20"
serde_tuple = "1.1.3"
serde_with = "3.18.0"
serial_test = { version = "3.2.0", features = ["file_locks"] }
socket2 = "0.6.3"
subenum = "1.1.3"
syn = { version = "2.0.118", features = ["full"] }
task-local = "0.1.1"
tekken = { package = "tekken-rs", version = "0.1.1", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.16"
thiserror-ext = "0.3.0"
tiktoken-rs = "0.9.1"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
toml = "0.9.12"
tokenizers = "0.22.0"
tokio = { version = "1.47.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic = "0.14.5"
tonic-build = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
trait-set = "0.3.0"
uuid = { version = "1.22.0", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
winnow = "1.0.2"
zeromq = { version = "0.6.0", default-features = false, features = [
    "tokio-runtime",
    "all-transport",
] }
iceoryx2 = "0.9.2"
iceoryx2-bb-elementary-traits = "0.9.2"

# ---- build-time helpers ----
flatbuffers-build = "0.2.4"
flatc-fork = "0.6.0"

[workspace.lints.clippy]
too_many_arguments = "allow"
clone_on_ref_ptr = "warn"
large_futures = "warn"
mem_forget = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[profile.dev]
panic = "abort"

[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"
