# Canonical execution-payload fingerprint vectors: the cross-language pin.
#
# Stage 1 of specs/unified_forward_execution.md requires Python and Rust to
# agree byte-for-byte on canonical execution identity. Each [[vector]] names
# one shared ExecuteBatch constructed identically by:
#   - Python tests/python/contract/worker/test_execution_contracts_vectors.py
#     over uniserve_worker/contracts/execution.py
#   - Rust  crates/foundation/core/src/execution_identity.rs (test module)
#
# Both sides compute canonical_payload_fingerprint and must reproduce the
# digest recorded here. Changing the encoding, a field order, or a value type
# on either side breaks one of the two tests; updating a digest here is an
# intentional cross-language protocol change.
#
# The vectors intentionally cover: a bare sequence advance; version-0
# admission with candidate verification plus cache and product leases; and a
# two-row flow + encode batch (row order sensitivity).

