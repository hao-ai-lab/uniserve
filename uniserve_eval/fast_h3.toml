# FastH3 on NVIDIA Blackwell GPUs: the deployments and workload of the
# UniServe FastH3 post. UNISERVE_FAST_H3_MODEL names a local copy of
# FastVideo/FastVideo-FastH3-8-Step-V2 and UNISERVE_FAST_H3_NVFP4_MODEL one of
# FastVideo/FastVideo-FastH3-8-Step-V2-NVFP4.
#
# Every point first sends the six warmup requests, which are not measured.
# A latency point then sends the 72 latency requests one at a time, 12 for
# each combination of a 5, 10 or 15 second clip and a 1000- or 10000-token
# prompt. A throughput point fills its concurrency with the priming requests,
# then measures the 32 throughput requests at that concurrency. Every
# request is a t2va request whose target is the 16:9 canvas (1344x768) and
# its row's duration, under the checkpoint's own schedule. Each suite covers
# one hardware configuration and checkpoint; run points serially, one server
# at a time.
#
# The gb200-8 deployments span two four-GPU hosts, rank-0 and rank-1. The
# evaluator starts the head on rank-0; when it logs "awaiting a launcher" with
# its listening port, start `.venv/bin/uniserve-host --head <rank-0
# address>:<port> --host-identity rank-1` on rank-1.
root = ".."
artifact_root = "artifacts/minimax_h3/fasth3-measurements"

[servers.gb200-4-bf16]
host = "127.0.0.1"
port = 18083
command = [".venv/bin/uniserve", "serve", "${UNISERVE_FAST_H3_MODEL}", "--served-model-name", "FastH3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/fasth3-ulysses4.json", "--max-batch", "2", "--max-running-requests", "2", "--max-num-batched-tokens", "2", "--chunked-prefill-size", "1", "--max-model-len", "16384", "--max-video-seconds", "15", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.gb200-4-bf16.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-4-bf16-latency]
server = "gb200-4-bf16"
task = "video"
model = "FastH3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/fasth3-latency.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-bf16-latency.load]
num_prompts = 72
request_rate = inf
max_concurrency = 1
warmup_requests = 0
request_timeout_s = 21600
seed = 20260925
warmup_manifest = "uniserve_eval/workloads/minimax_h3/fasth3-warmup.jsonl"

[benchmarks.gb200-4-bf16-latency.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.gb200-4-bf16-throughput-c1]
server = "gb200-4-bf16"
task = "video"
model = "FastH3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/fasth3-throughput.jsonl"
endpoint = "/v1/videos/sync"

