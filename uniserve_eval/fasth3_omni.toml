# FastH3 Omni on eight RTX PRO 6000 GPUs as one Ulysses8 reference
# replica, with the eight-H200 matrix's capacities and seeds; SM120 runs
# its 128-row sparse-attention tiles as 64-row kernel tiles.
[servers.rtx-pro-6000-8-refs]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_FASTH3_OMNI_MODEL}", "--served-model-name", "FastH3-Omni", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses8-reference.json", "--max-running-requests", "2", "--max-model-len", "24576", "--video-text-capacities", "4096,7168,8192,9216,10240,12288,15360", "--max-video-seconds", "15", "--max-condition-rows", "56192", "--media-directory", "${UNISERVE_MINIMAX_H3_INPUTS}", "--ffprobe", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--ffmpeg", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.92", "--dtype", "bfloat16", "--graph-policy", "off", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.rtx-pro-6000-8-refs.environment]
CUDA_VISIBLE_DEVICES = "0,1,2,3,4,5,6,7"

[benchmarks.rtx-pro-6000-8-ref-image-5s]
