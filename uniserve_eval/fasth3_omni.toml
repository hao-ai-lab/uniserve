# FastH3 Omni on H200 GPUs, whose 128-row sparse-attention tiles run on
# the SM90 kernel: the reference matrix as one eight-way Ulysses replica on one
# eight-GPU host (`ulysses8-reference.json`), with the capacities of the
# gb200-8 matrix suites. An H200 holds 141 GB, so both servers grant their
# workers 0.92 of a device.
[servers.h200-8-refs]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_FASTH3_OMNI_MODEL}", "--served-model-name", "FastH3-Omni", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses8-reference.json", "--max-running-requests", "2", "--max-model-len", "24576", "--video-text-capacities", "4096,7168,8192,9216,10240,12288,15360", "--max-video-seconds", "15", "--max-condition-rows", "56192", "--media-directory", "${UNISERVE_MINIMAX_H3_INPUTS}", "--ffprobe", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--ffmpeg", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.92", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.h200-8-refs.environment]
CUDA_VISIBLE_DEVICES = "0,1,2,3,4,5,6,7"

[benchmarks.h200-8-ref-image-5s]
