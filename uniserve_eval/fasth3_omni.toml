# FastH3 Omni reference-to-video on GB200, H200 and RTX PRO 6000 GPUs.
#
# UNISERVE_FASTH3_OMNI_MODEL names a local copy of
# FastVideo/FastVideo-FastH3-Omni-8-Step-V1; the Hugging Face cache holds the
# MiniMax-H3 revision its fastvideo_inference.json pins (base_model_revision).
# UNISERVE_MINIMAX_H3_INPUTS names the directory whose media/ holds the files
# the workload rows name, and UNISERVE_MINIMAX_H3_FFMPEG the bin directory of
# FFmpeg 8.1.2.
#
# Workloads (uniserve_eval/workloads/minimax_h3/): W4 and W5, one image with a
# voice and one reference video with its soundtrack and a voice, 5 s; and the
# reference matrix ref-<composition>-<seconds>s, nine compositions at 5, 10
# and 15 s, 16:9. A point sends one warmup at seed 42, then its measured
# requests one at a time from seed 0.
#
# Suites are <gpu>-<count>[-<variant>]; -enlarged suites enlarge every
# reference image to its encoding size. Run points serially, one server at a
# time; a two-host deployment starts as in fasth3.toml.
root = ".."
artifact_root = "artifacts/fasth3_omni/measurements"

# FastH3 Omni on the same deployment file: the export's reference DiT
# with the other components of its pinned base. Its segment-sparse attention
# packs each condition into whole 128-row tiles, so W5 takes 47,104
# condition rows there; the capacity is 49,152. References are enlarged to
# their encoding size here too.
[servers.gb200-4]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_FASTH3_OMNI_MODEL}", "--served-model-name", "FastH3-Omni", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses4-reference.json", "--max-running-requests", "2", "--max-model-len", "8192", "--video-text-capacities", "8192", "--max-video-seconds", "5", "--max-condition-rows", "49152", "--media-directory", "${UNISERVE_MINIMAX_H3_INPUTS}", "--ffprobe", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--ffmpeg", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}", "--mm-processor-kwargs", "{\"enlarge_references\":true}"]

[servers.gb200-4.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-4-w4]
server = "gb200-4"
task = "video"
model = "FastH3-Omni"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w4.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w4.video]
task = "ref2va"
aspect_ratio = "auto"
condition_root = "${UNISERVE_MINIMAX_H3_INPUTS}"

[benchmarks.gb200-4-w4.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w4-warmup.jsonl"

[benchmarks.gb200-4-w4.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.gb200-4-w5]
server = "gb200-4"
task = "video"
model = "FastH3-Omni"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w5.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w5.video]
task = "ref2va"
aspect_ratio = "auto"
condition_root = "${UNISERVE_MINIMAX_H3_INPUTS}"

[benchmarks.gb200-4-w5.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w5-warmup.jsonl"

[benchmarks.gb200-4-w5.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

# FastH3 Omni on the reference matrix, across two four-GB200 hosts as one
# eight-way Ulysses replica. References keep their own size unless they
# exceed their encoding size, the server's default. One
# deployment serves every cell: the 15-second range, a text capacity for each
# cell's prompt (3,410 to 23,874 tokens; a visual reference's vision tokens
# are prompt tokens) and the condition capacity of the largest composition
# (56,192 rows, nine square images and three 2-second clips with their
# soundtracks). The largest request, that composition at 15 s, packs 189,830
# sequence rows. The media reader publishes decoded references from a GPU
# rank, the text encoder runs on rank-0's four GPUs and the latent encoder
# deals condition units to the ranks the prompt leaves free, rank-1's GPUs
# first, so both hosts encode a request's conditions together.
[servers.gb200-8-refs]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_FASTH3_OMNI_MODEL}", "--served-model-name", "FastH3-Omni", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses8-reference-two-node.json", "--max-running-requests", "2", "--max-model-len", "24576", "--video-text-capacities", "4096,7168,8192,9216,10240,12288,15360", "--max-video-seconds", "15", "--max-condition-rows", "56192", "--media-directory", "${UNISERVE_MINIMAX_H3_INPUTS}", "--ffprobe", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--ffmpeg", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--host-identity", "rank-0", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.gb200-8-refs.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-8-ref-image-5s]
server = "gb200-8-refs"
task = "video"
model = "FastH3-Omni"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/ref-image-5s.jsonl"
endpoint = "/v1/videos/sync"

