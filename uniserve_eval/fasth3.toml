# FastH3 text-to-video on GB200, H200 and RTX PRO 6000 GPUs.
#
# UNISERVE_FASTH3_MODEL and UNISERVE_FASTH3_NVFP4_MODEL name local copies of
# FastVideo/FastVideo-FastH3-8-Step-V2 and its -NVFP4 variant.
#
# A latency point sends 72 requests one at a time, 12 for each combination of
# a 5, 10 or 15 second clip and a 1000- or 10000-token prompt. A throughput
# point fills its concurrency with priming requests, then measures 32
# requests at that concurrency. Every request is a 16:9 (1344x768) t2va
# request under the checkpoint's own schedule.
#
# Suites are <gpu>-<count>-<precision>[-<layout>]. Run points serially, one
# server at a time. A two-host deployment starts its head on rank-0; when the
# head logs "awaiting a launcher", start `.venv/bin/uniserve-host --head
# <rank-0 address>:<port> --host-identity rank-1` on rank-1.
root = ".."
artifact_root = "artifacts/fasth3/measurements"

[servers.gb200-4-bf16]
host = "127.0.0.1"
port = 18083
command = [".venv/bin/uniserve", "serve", "${UNISERVE_FASTH3_MODEL}", "--served-model-name", "FastH3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses4.json", "--max-running-requests", "2", "--max-model-len", "16384", "--max-video-seconds", "15", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.gb200-4-bf16.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-4-bf16-latency]
server = "gb200-4-bf16"
task = "video"
model = "FastH3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/fasth3-latency.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-bf16-latency.load]
num_prompts = 72
request_rate = inf
max_concurrency = 1
request_timeout_s = 21600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/fasth3-warmup.jsonl"

[benchmarks.gb200-4-bf16-latency.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.gb200-4-bf16-throughput-c1]
server = "gb200-4-bf16"
task = "video"
model = "FastH3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/fasth3-throughput.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-bf16-throughput-c1.load]
num_prompts = 32
request_rate = inf
max_concurrency = 1
request_timeout_s = 21600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/fasth3-warmup.jsonl"
priming_manifest = "uniserve_eval/workloads/minimax_h3/fasth3-priming-c1.jsonl"

