# Eight one-GPU denoiser replicas sharing one TP8 text encoder on the same
# eight RTX PRO 6000 GPUs, under the throughput points' workload. A replica
# keeps its denoising local, so no denoiser collective crosses PCIe. A
# replica's workspace holds a whole 15-second sequence on one 96 GB GPU, so
# these deployments bound prompts at 10240 tokens (the workload's longest is
# 10000) and prepare only the workload's 16:9 canvas.
[servers.rtx-pro-6000-8-nvfp4-dp8]
host = "127.0.0.1"
port = 18083
command = [".venv/bin/uniserve", "serve", "${UNISERVE_FASTH3_NVFP4_MODEL}", "--served-model-name", "FastH3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/dp8-text-tp8.json", "--max-running-requests", "8", "--max-model-len", "10240", "--max-video-seconds", "15", "--mem-fraction-static", "0.92", "--dtype", "bfloat16", "--graph-policy", "off", "--video-text-capacities", "1024", "--video-aspect-ratios", "16:9"]

