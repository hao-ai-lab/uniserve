model = "FastH3"
dataset = "minimax-h3"
tokenizer = "${UNISERVE_FASTH3_MODEL}/tokenizer"

[benchmarks.h200-8-bf16-dp8-5s-1k.video]
seconds = 5.0
prompt_tokens = 1000

[benchmarks.h200-8-bf16-dp8-5s-1k.load]
num_prompts = 16
request_rate = inf
max_concurrency = 8
warmup_requests = 8

[benchmarks.h200-8-bf16-dp8-5s-1k.metrics]
videos_per_second = "higher"
"video_latency_ms.mean" = "lower"
