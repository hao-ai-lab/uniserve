# FastH3 qualification on Hopper GPUs. The device default uses BF16 with
# FP16 video projections; the checkpoint owns the eight-step schedule.
root = ".."
artifact_root = "artifacts/hopper/measurements"

[servers.hopper-ulysses4]
host = "127.0.0.1"
port = 18083
command = ["target/release/uniserve", "serve", "${UNISERVE_MINIMAX_H3_MODEL}", "--served-model-name", "FastH3", "--workers", "configs/minimax-h3-four-devices.json", "--worker-python", ".venv/bin/python", "--port", "18083", "--max-model-len", "1024", "--video-text-capacities", "1024", "--max-video-seconds", "5", "--max-running-requests", "2", "--graph-policy", "full", "--mem-fraction-static", "0.92"]

[servers.hopper-ulysses4.environment]
CUDA_MODULE_LOADING = "EAGER"
CUDA_VISIBLE_DEVICES = "0,1,2,3"
OMP_NUM_THREADS = "1"
MAX_JOBS = "8"
NCCL_CUMEM_HOST_ENABLE = "1"

[benchmarks.hopper-ulysses4-5s-1k]
server = "hopper-ulysses4"
task = "video"
model = "FastH3"
dataset = "minimax-h3"
tokenizer = "${UNISERVE_MINIMAX_H3_MODEL}/tokenizer"

[benchmarks.hopper-ulysses4-5s-1k.video]
seconds = 5.0
prompt_tokens = 1000

[benchmarks.hopper-ulysses4-5s-1k.load]
num_prompts = 3
request_rate = inf
max_concurrency = 1
warmup_requests = 1
seed = 1000

[benchmarks.hopper-ulysses4-5s-1k.metrics]
videos_per_second = "higher"
"video_latency_ms.mean" = "lower"

[suites.hopper]
points = ["hopper-ulysses4-5s-1k"]

[servers.hopper-ulysses8]
