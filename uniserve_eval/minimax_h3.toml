seconds = 5.0
num_inference_steps = 50
flow_shift = 12.0
audio_flow_shift = 3.0

[benchmarks.gb200-8-w1.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
warmup_requests = 0
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w1-warmup.jsonl"

[benchmarks.gb200-8-w1.metrics]
