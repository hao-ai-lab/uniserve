"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[suites.gb200-4]
points = ["gb200-4-w1", "gb200-4-w2"]

[suites.gb200-8]
points = ["gb200-8-w1", "gb200-8-w2"]
