# MiniMax-H3 base checkpoint text-to-video-and-audio on NVIDIA GB200 GPUs:
# the UniServe, SGLang and vLLM-Omni deployments of the W1 and W2 performance
# workloads. UNISERVE_MINIMAX_H3_MODEL names a local copy of
# MiniMaxAI/MiniMax-H3 at revision 42ed227ee7df40d41602854ae760620d6eb651fe.
#
# Both workloads send the official t2va request prompt (537 prompt tokens) as
# a t2va request whose target is the 16:9 canvas (1344x768) and state the
# checkpoint's schedule: 50 sigma points (49 denoiser evaluations), video
# shift 12 and audio shift 3. UniServe refuses a request whose schedule is not
# the one it serves; the baselines run the schedule they are sent. W1
# generates 5 seconds (124 frames) and W2 15 seconds (362 frames). A point
# first sends its one warmup request, which is not measured, then its
# measured requests one at a time: eight for W1 and four for W2, each with
# its own seed. Each suite covers one system on one hardware configuration;
# run points serially, one server at a time.
#
# A deployment admits the full 15-second range and one 1024-token text
# capacity, which holds the official prompt. The serving options follow the
# FastH3 GB200 deployments in docs/fast_h3/fast_h3.md.
#
# The gb200-8 deployment spans two four-GPU hosts, rank-0 and rank-1. The
# evaluator starts the head on rank-0; when it logs "awaiting a launcher" with
# its listening port, start `.venv/bin/uniserve-host --head <rank-0
# address>:<port> --host-identity rank-1` on rank-1.
root = ".."
artifact_root = "artifacts/minimax_h3/measurements"

[servers.gb200-4]
host = "127.0.0.1"
port = 18083
command = [".venv/bin/uniserve", "serve", "${UNISERVE_MINIMAX_H3_MODEL}", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses4.json", "--max-batch", "2", "--max-running-requests", "2", "--max-num-batched-tokens", "2", "--chunked-prefill-size", "1", "--max-model-len", "1024", "--video-text-capacities", "1024", "--max-video-seconds", "15", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.gb200-4.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-4-w1]
server = "gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w1.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w1.video]
task = "t2va"
aspect_ratio = "16:9"
seconds = 5.0
num_inference_steps = 50
flow_shift = 12.0
audio_flow_shift = 3.0

[benchmarks.gb200-4-w1.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
warmup_requests = 0
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w1-warmup.jsonl"

[benchmarks.gb200-4-w1.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.gb200-4-w2]
server = "gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w2.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w2.video]
task = "t2va"
