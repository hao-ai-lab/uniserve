# MiniMax-H3 on NVIDIA GB200, H200 and RTX PRO 6000 GPUs: UniServe
# deployments of the base checkpoint's two denoisers and of FastH3 OmniRef,
# on the workloads W1 to W5 and the OmniRef reference matrix. FastH3 8-Step
# V2 is measured by uniserve_eval/fast_h3.toml.
#
# Environment:
# - UNISERVE_MINIMAX_H3_MODEL names a local copy of MiniMaxAI/MiniMax-H3 at
#   revision 42ed227ee7df40d41602854ae760620d6eb651fe.
# - UNISERVE_MINIMAX_H3_INPUTS names the protocol inputs directory, whose
#   media/ holds the condition media the W3, W4, W5 and reference matrix
#   rows name.
# - UNISERVE_MINIMAX_H3_OMNIREF names a local copy of
#   FastVideo/FastVideo-FastH3-Omni-8-Step-V1; the Hugging Face cache holds
#   the MiniMax-H3 revision its fastvideo_inference.json pins
#   (base_model_revision), from which UniServe reads the components the
#   export omits.
# - UNISERVE_MINIMAX_H3_FFMPEG names the bin directory of the FFmpeg 8.1.2
#   build whose ffprobe probes condition media and whose ffmpeg decodes
#   reference videos.
#
# Workloads (uniserve_eval/workloads/minimax_h3/), each a t2va, fl2va or
# ref2va request at the 768-pixel short edge:
# - W1: the official t2va prompt (537 prompt tokens), 16:9 (1344x768), 5 s
#   (124 frames).
# - W2: the same prompt, 16:9, 15 s (362 frames).
# - W3: the official fl2va request: its first keyframe and prompt, auto
#   canvas (the 16:9 keyframe resolves 1344x768), 8 s (192 frames).
# - W4: a ref2va image reference (2560x1440) and the official audio
#   reference, auto canvas (16:9), 5 s.
# - W5: the official ref2va request: its reference video, whose soundtrack
#   conditions too, and its audio reference, auto canvas (16:9), 5 s.
# - ref-<composition>-<seconds>s: the FastH3 OmniRef reference matrix, each
#   ref2va at 16:9, nine compositions at 5, 10 and 15 s: one subject image
#   (image), with a reference voice (image-voice), three images (images3),
#   nine square images (images9), one 2-second clip with its soundtrack
#   (clip), one 6-second reference video with its soundtrack (video), three
#   2-second clips (clips3), an image, a reference video and a reference
#   voice together (mixed), and nine square images with three 2-second
#   clips (full).
# A point states no schedule; the server runs its checkpoint's own.
#
# A point first sends its one warmup row (seed 42), which is not measured,
# then its measured rows one at a time, each with its own seed from 0: four
# for W2 (15 s), three for a reference matrix cell and eight for every other
# workload. Rows repeat their workload's prompt and media. Each suite covers
# one deployment on one hardware configuration; run points serially, one
# server at a time. A server is ready when its /health answers 200; startup
# time is measured to that point.
#
# The gb200-8 deployments span two four-GPU hosts, rank-0 and rank-1. The
# evaluator starts the head on rank-0; when it logs "awaiting a launcher" with
# its listening port, start `.venv/bin/uniserve-host --head <rank-0
# address>:<port> --host-identity rank-1` on rank-1.
root = ".."
artifact_root = "artifacts/minimax_h3/measurements"

# The serving options follow the FastH3 GB200 deployments in
# docs/minimax_h3/minimax_h3.md. Each deployment is sized for the workloads it
# serves: the text capacity holds the presented prompt (537 tokens for W1
# and W2; 1935 text rows for W3; up to 6913 for W5), the duration bound the
# longest target, and the condition capacity the rows the references pack.

# Base FL2VA (the diffusers root's transformer component) for t2va: the full
# 15-second range and one 1024-token text capacity.
[servers.gb200-4]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_MINIMAX_H3_MODEL}", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses4.json", "--max-running-requests", "2", "--max-model-len", "1024", "--video-text-capacities", "1024", "--max-video-seconds", "15", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.gb200-4.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-4-w1]
server = "gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w1.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w1.video]
task = "t2va"
aspect_ratio = "16:9"

[benchmarks.gb200-4-w1.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w1-warmup.jsonl"

[benchmarks.gb200-4-w1.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.gb200-4-w2]
server = "gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w2.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w2.video]
task = "t2va"
aspect_ratio = "16:9"

[benchmarks.gb200-4-w2.load]
num_prompts = 4
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w2-warmup.jsonl"

[benchmarks.gb200-4-w2.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

