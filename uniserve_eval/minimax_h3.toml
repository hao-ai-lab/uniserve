# FastH3 OmniRef on H200 GPUs, whose 128-row sparse-attention tiles run on
# the SM90 kernel: the reference matrix as one eight-way Ulysses replica on one
# eight-GPU host (`ulysses8-reference.json`), with the capacities of the
# gb200-8 matrix suites. An H200 holds 141 GB, so both servers grant their
# workers 0.92 of a device.
[servers.h200-8-omniref-refs]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
