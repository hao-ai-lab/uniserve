# FastH3 OmniRef on the reference matrix, across two four-GB200 hosts as one
# eight-way Ulysses replica; for these points UNISERVE_MINIMAX_H3_OMNIREF
# names FastVideo/FastVideo-FastH3-Omni-8-Step-V1. One deployment serves
# every cell: the 15-second range, a text capacity for each cell's prompt
# (3,410 to 47,160 tokens; a visual reference's vision tokens are prompt
# tokens) and the condition capacity of the largest composition (79,104 rows,
# nine square images and three 2-second clips with their soundtracks). The
# largest request, that composition at 15 s, packs 236,294 sequence rows. The
# media reader publishes decoded references from a GPU rank, the text encoder
# runs on rank-0's four GPUs and the latent encoder deals condition units to
# the ranks the prompt leaves free, rank-1's GPUs first, so both hosts encode
# a request's conditions together.
