# Baselines on one four-GPU GB200 host. UNISERVE_MINIMAX_H3_SGLANG and
# UNISERVE_MINIMAX_H3_VLLM_OMNI name the virtual environments of SGLang at
# ef867fa40d and vLLM-Omni at bbee488da (with vLLM 0.30.0). Both load the
# checkpoint's native FL2VA partition of the same revision, the release's own
# layout of the model UniServe loads from the root diffusers components, and
# hold only that denoiser.
# Their requests carry the same work as UniServe's: the canvas, the frame
# count, the 50-point schedule (vLLM-Omni counts its 49 intervals), the
# shifts and the seed. Neither runs a lossy path: no step cache, no sparse or
# quantized attention, no FP8. The servers draw the audio noise from a
# generator reseeded with the request seed rather than continuing the video
# generator, so a seed gives a different sample than UniServe's, at the same
# cost. Their MP4 encoders differ from UniServe's libx264 ultrafast: SGLang
# runs preset fast at CRF 25, a preset its source fixes, and vLLM-Omni
# ultrafast at CRF 18.
#
# SGLang follows its cookbook's GB200 recipe: Ulysses 4 with every component
# resident (performance mode speed), the Qwen3-VL text encoder folded across
# the four ranks, platform attention (cuDNN SDPA for the dense packed
# attention) and eager execution. Its cross-request conditioning cache is
# disabled: every measured row repeats the official prompt, and UniServe
# encodes each request's prompt. Requests state quality=lossless, which also
# keeps an environment-enabled Cache-DiT policy off. SGLang has no
# synchronous video route, so the evaluator polls the job and fetches the MP4
# that the server writes to its output directory; the output and upload
# directories are on the host's local disk rather than in this tree.
[servers.sglang-gb200-4]
host = "127.0.0.1"
port = 18083
command = ["${UNISERVE_MINIMAX_H3_SGLANG}/bin/sglang", "serve", "--model-path", "${UNISERVE_MINIMAX_H3_MODEL}", "--model-variant", "fl2va", "--num-gpus", "4", "--ulysses-degree", "4", "--performance-mode", "speed", "--disable-conditioning-cache", "--output-path", "/tmp/sglang-minimax-h3/outputs", "--input-save-path", "/tmp/sglang-minimax-h3/inputs", "--host", "127.0.0.1", "--port", "18083"]

# The H3 pipeline requires ffmpeg and ffprobe on PATH; the environment's bin
# directory provides the Ubuntu 24.04 package that SGLang's image installs.
# Importing the Qwen3-VL encoder imports DeepEP, which H3 never runs; its
# import-time check counts the host's NCCL network plugin as a second NCCL
# runtime, so EP_SUPPRESS_NCCL_CHECK skips that check.
[servers.sglang-gb200-4.environment]
CUDA_HOME = "/usr/local/cuda"
PATH = "${UNISERVE_MINIMAX_H3_SGLANG}/bin:/usr/local/cuda/bin:${PATH}"
SGLANG_RUST_BUILD_MODE = "never"
EP_SUPPRESS_NCCL_CHECK = "1"

[benchmarks.sglang-gb200-4-w1]
server = "sglang-gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w1.jsonl"
endpoint = "/v1/videos"

[benchmarks.sglang-gb200-4-w1.video]
backend = "sglang"
task = "t2va"
aspect_ratio = "16:9"
seconds = 5.0
num_inference_steps = 50
flow_shift = 12.0
audio_flow_shift = 3.0
extra_params = { quality = "lossless" }

[benchmarks.sglang-gb200-4-w1.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
warmup_requests = 0
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w1-warmup.jsonl"

[benchmarks.sglang-gb200-4-w1.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.sglang-gb200-4-w2]
server = "sglang-gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w2.jsonl"
endpoint = "/v1/videos"

[benchmarks.sglang-gb200-4-w2.video]
backend = "sglang"
task = "t2va"
aspect_ratio = "16:9"
seconds = 15.0
num_inference_steps = 50
flow_shift = 12.0
audio_flow_shift = 3.0
extra_params = { quality = "lossless" }

[benchmarks.sglang-gb200-4-w2.load]
