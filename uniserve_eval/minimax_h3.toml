# ----------------------------------------------------------------- Baselines
# Baselines on one four-GPU GB200 host. UNISERVE_MINIMAX_H3_SGLANG,
# UNISERVE_MINIMAX_H3_VLLM_OMNI and UNISERVE_MINIMAX_H3_FASTVIDEO name the
# virtual environments of SGLang at ef867fa40d, vLLM-Omni at bbee488da (with
# vLLM 0.30.0) and FastVideo at 8c94e4e (feat/fasth3-omniref-pdd-inference).
# SGLang and vLLM-Omni load the checkpoint's native FL2VA or Ref2VA partition
# of the same revision, the release's own layout of the model UniServe loads
# from the root diffusers components, and hold only that denoiser.
#
# Their requests carry the same work as UniServe's: the prompt, the
# condition media files, the canvas, the frame count, the schedule (vLLM-Omni
# counts its 49 intervals, FastVideo OmniRef its 8 fused blocks), the shifts
# and the seed. SGLang reads the media from the same file:// URIs, vLLM-Omni
# receives the files as uploaded request parts, and FastVideo by their local
# paths. None runs a lossy path: no step cache, no sparse or quantized
# attention beyond OmniRef's trained sparsity, no FP8.
#
# Disclosed differences that remain:
# - Noise: SGLang and vLLM-Omni draw the audio noise, and each condition's
#   noise, from generators reseeded with the request seed rather than
#   continuing one generator, so a seed gives a different sample than
#   UniServe's, at the same cost.
# - MP4 encoders: UniServe libx264 ultrafast; SGLang preset fast at CRF 25, a
#   preset its source fixes; vLLM-Omni ultrafast at CRF 18; FastVideo
#   ultrafast at x264's default CRF.
# - Reference images: vLLM-Omni encodes a reference image at its own size
#   rounded to 32 pixels (W4: 2560x1440, 3600 condition rows) where the
#   others scale its short edge to 2048 (3648x2048, 7296 rows), so its W4
#   conditioning is smaller.
# - Soundtracks: SGLang and vLLM-Omni extract a reference video's soundtrack
#   at 44.1 kHz before resampling it to 32 kHz; UniServe and FastVideo
#   resample the native rate once.
# - Readiness: vLLM-Omni compiles its DiT regions on the first request, which
#   the warmup row covers, so its startup time excludes compilation.

# SGLang follows its cookbook's GB200 recipe: Ulysses 4 with every component
# resident (performance mode speed), the Qwen3-VL text encoder folded across
# the four ranks, platform attention (cuDNN SDPA for the dense packed
# attention) and eager execution. Its cross-request conditioning cache, which
# keeps Qwen3-VL outputs of the text and the reference images and videos, is
# disabled: every measured row repeats its workload's prompt and media, and
# UniServe encodes each request's conditions. Requests state quality=lossless,
# which also keeps an environment-enabled Cache-DiT policy off. SGLang has no
# synchronous video route, so the evaluator polls the job and fetches the MP4
# that the server writes to its output directory; the output and upload
# directories are on the host's local disk rather than in this tree.
[servers.sglang-gb200-4]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = ["${UNISERVE_MINIMAX_H3_SGLANG}/bin/sglang", "serve", "--model-path", "${UNISERVE_MINIMAX_H3_MODEL}", "--model-variant", "fl2va", "--num-gpus", "4", "--ulysses-degree", "4", "--performance-mode", "speed", "--disable-conditioning-cache", "--output-path", "/tmp/sglang-minimax-h3/outputs", "--input-save-path", "/tmp/sglang-minimax-h3/inputs", "--host", "127.0.0.1", "--port", "18083"]

# The H3 pipeline requires ffmpeg and ffprobe on PATH; the environment's bin
# directory provides the Ubuntu 24.04 package that SGLang's image installs.
# Importing the Qwen3-VL encoder imports DeepEP, which H3 never runs; its
# import-time check counts the host's NCCL network plugin as a second NCCL
# runtime, so EP_SUPPRESS_NCCL_CHECK skips that check.
[servers.sglang-gb200-4.environment]
CUDA_HOME = "/usr/local/cuda"
PATH = "${UNISERVE_MINIMAX_H3_SGLANG}/bin:/usr/local/cuda/bin:${PATH}"
SGLANG_RUST_BUILD_MODE = "never"
EP_SUPPRESS_NCCL_CHECK = "1"

[benchmarks.sglang-gb200-4-w1]
server = "sglang-gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w1.jsonl"
endpoint = "/v1/videos"

