request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w2-warmup.jsonl"

[benchmarks.sglang-gb200-4-w2.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

# vLLM-Omni follows its four-GPU recipe: Ulysses 4, ring 1, VAE patch
# parallelism 4 in the native tile mode, regional torch.compile of the DiT
# blocks, and the default dense BF16 TRTLLM_ATTN attention. --task-type
# fl2va loads only the FL2VA denoiser, which serves t2va, where the recipe's
# combined service would also hold the Ref2VA one. The server compiles on
# its first request, which the warmup request covers. --cache-backend none
# keeps an environment-selected cache backend off, the synchronous route's
# timeout matches the request timeout, and NCCL_NVLS_ENABLE=0 matches the
# UniServe deployments and SGLang's default.
[servers.vllm-omni-gb200-4]
host = "127.0.0.1"
port = 18083
command = ["${UNISERVE_MINIMAX_H3_VLLM_OMNI}/bin/vllm", "serve", "${UNISERVE_MINIMAX_H3_MODEL}/FL2VA", "--omni", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--trust-remote-code", "--task-type", "fl2va", "--num-gpus", "4", "--usp", "4", "--ring", "1", "--vae-patch-parallel-size", "4", "--vae-parallel-mode", "tile", "--vae-use-tiling", "--cache-backend", "none"]

# The environment's bin directory provides the ffmpeg and ffprobe the server
# requires, and opt/x11-lib the X11 and GL client libraries (from the same
# Ubuntu 24.04 packages) that its opencv-python build loads. Without them the
# server's OpenCV import fails and leaves OpenCV's package directory on
# sys.path; the spawned workers inherit it, resolve the standard typing module
# into OpenCV, and exit before loading the model.
[servers.vllm-omni-gb200-4.environment]
PATH = "${UNISERVE_MINIMAX_H3_VLLM_OMNI}/bin:${PATH}"
LD_LIBRARY_PATH = "${UNISERVE_MINIMAX_H3_VLLM_OMNI}/opt/x11-lib"
VLLM_WORKER_MULTIPROC_METHOD = "spawn"
VLLM_OMNI_VIDEO_SYNC_TIMEOUT = "3600"
NCCL_NVLS_ENABLE = "0"

[benchmarks.vllm-omni-gb200-4-w1]
server = "vllm-omni-gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w1.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.vllm-omni-gb200-4-w1.video]
backend = "vllm-omni"
task = "t2va"
aspect_ratio = "16:9"
seconds = 5.0
num_inference_steps = 50
flow_shift = 12.0
audio_flow_shift = 3.0

[benchmarks.vllm-omni-gb200-4-w1.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
warmup_requests = 0
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w1-warmup.jsonl"

[benchmarks.vllm-omni-gb200-4-w1.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.vllm-omni-gb200-4-w2]
server = "vllm-omni-gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w2.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.vllm-omni-gb200-4-w2.video]
backend = "vllm-omni"
