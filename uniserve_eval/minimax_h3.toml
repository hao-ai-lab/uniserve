# The MiniMax-H3 base checkpoint on GB200 GPUs.
#
# UNISERVE_MINIMAX_H3_MODEL names a local copy of MiniMaxAI/MiniMax-H3 at
# revision 42ed227ee7df40d41602854ae760620d6eb651fe.
# UNISERVE_MINIMAX_H3_INPUTS names the directory whose media/ holds the files
# the workload rows name, and UNISERVE_MINIMAX_H3_FFMPEG the bin directory of
# FFmpeg 8.1.2.
#
# Workloads (uniserve_eval/workloads/minimax_h3/), at the 768-pixel short
# edge: W1 and W2, the official t2va prompt at 5 and 15 s; W3, the official
# fl2va first-keyframe request, 8 s; W4 and W5, the ref2va image-and-voice and
# video-and-voice requests, 5 s. The checkpoint's schedule is 50 sigma points.
# A point sends one warmup at seed 42, then its measured requests one at a
# time from seed 0.
#
# Run points serially, one server at a time; a two-host deployment starts as
# in fasth3.toml.
root = ".."
artifact_root = "artifacts/minimax_h3/measurements"

# The serving options follow the FastH3 GB200 deployments in
# docs/minimax_h3/minimax_h3.md. Each deployment is sized for the workloads it
# serves: the text capacity holds the presented prompt (537 tokens for W1
# and W2; 1935 text rows for W3; up to 6913 for W5), the duration bound the
# longest target, and the condition capacity the rows the references pack.

# Base FL2VA (the diffusers root's transformer component) for t2va: the full
# 15-second range and one 1024-token text capacity.
[servers.gb200-4]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_MINIMAX_H3_MODEL}", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses4.json", "--max-running-requests", "2", "--max-model-len", "1024", "--video-text-capacities", "1024", "--max-video-seconds", "15", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.gb200-4.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-4-w1]
server = "gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w1.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w1.video]
task = "t2va"
aspect_ratio = "16:9"

[benchmarks.gb200-4-w1.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w1-warmup.jsonl"

[benchmarks.gb200-4-w1.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.gb200-4-w2]
server = "gb200-4"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w2.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w2.video]
task = "t2va"
aspect_ratio = "16:9"

[benchmarks.gb200-4-w2.load]
num_prompts = 4
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w2-warmup.jsonl"

[benchmarks.gb200-4-w2.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

# Base FL2VA for the official first-frame request: 8 seconds and a
# 2048-token text capacity. The keyframe takes 1008 condition rows, within
# the default condition capacity of two keyframes.
[servers.gb200-4-keyframe]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_MINIMAX_H3_MODEL}", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses4.json", "--max-running-requests", "2", "--max-model-len", "2048", "--video-text-capacities", "2048", "--max-video-seconds", "8", "--media-directory", "${UNISERVE_MINIMAX_H3_INPUTS}", "--ffprobe", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--ffmpeg", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.gb200-4-keyframe.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-4-w3]
server = "gb200-4-keyframe"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w3.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-w3.video]
task = "fl2va"
aspect_ratio = "auto"
condition_root = "${UNISERVE_MINIMAX_H3_INPUTS}"

[benchmarks.gb200-4-w3.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w3-warmup.jsonl"

[benchmarks.gb200-4-w3.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

# Base Ref2VA (the diffusers root's transformer_ref component): 5 seconds, an
# 8192-token text capacity and 40,960 condition rows, which hold W5's
# reference video, its soundtrack and the audio reference (about 38,000
# rows packed densely). References are enlarged to their encoding size, as
# the released pipeline sizes them.
[servers.gb200-4-reference]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_MINIMAX_H3_MODEL}", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses4-reference.json", "--max-running-requests", "2", "--max-model-len", "8192", "--video-text-capacities", "8192", "--max-video-seconds", "5", "--max-condition-rows", "40960", "--media-directory", "${UNISERVE_MINIMAX_H3_INPUTS}", "--ffprobe", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--ffmpeg", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--quantization-config", "{\"mode\":\"quality\"}", "--mm-processor-kwargs", "{\"enlarge_references\":true}"]

[servers.gb200-4-reference.environment]
NCCL_NVLS_ENABLE = "0"

[benchmarks.gb200-4-reference-w4]
server = "gb200-4-reference"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w4.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-reference-w4.video]
task = "ref2va"
aspect_ratio = "auto"
condition_root = "${UNISERVE_MINIMAX_H3_INPUTS}"

[benchmarks.gb200-4-reference-w4.load]
num_prompts = 8
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/w4-warmup.jsonl"

[benchmarks.gb200-4-reference-w4.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.gb200-4-reference-w5]
server = "gb200-4-reference"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/w5.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.gb200-4-reference-w5.video]
task = "ref2va"
