# Base Ref2VA (the diffusers root's reference_denoiser): 5 seconds, an
# 8192-token text capacity and 40,960 condition rows, which hold W5's
# reference video, its soundtrack and the audio reference (about 38,000
# rows packed densely).

# SGLang across rank-0 and rank-1: its cookbook's GB200 2x4 recipe, Ulysses 4
# within a host and ring attention of degree 2 across the hosts, resident
# components, the text encoder replicated across the nodes; ring attention
# selects FlashAttention. The evaluator starts node rank 0 on rank-0, whose
# address UNISERVE_MINIMAX_H3_HEAD_ADDRESS names; start node rank 1 on
# rank-1 with the same command and --node-rank 1 for each server start, and
# stop it once the head exits.
[servers.sglang-gb200-8]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = ["${UNISERVE_MINIMAX_H3_SGLANG}/bin/sglang", "serve", "--model-path", "${UNISERVE_MINIMAX_H3_MODEL}", "--model-variant", "fl2va", "--num-gpus", "8", "--sp-degree", "8", "--ulysses-degree", "4", "--ring-degree", "2", "--nnodes", "2", "--node-rank", "0", "--dist-init-addr", "${UNISERVE_MINIMAX_H3_HEAD_ADDRESS}:20000", "--encoder-parallel", "replicate", "--performance-mode", "speed", "--disable-conditioning-cache", "--output-path", "/tmp/sglang-minimax-h3/outputs", "--input-save-path", "/tmp/sglang-minimax-h3/inputs", "--host", "127.0.0.1", "--port", "18083"]

# The H3 pipeline requires ffmpeg and ffprobe on PATH; the environment's bin
# directory provides the Ubuntu 24.04 package that SGLang's image installs.
# Importing the Qwen3-VL encoder imports DeepEP, which H3 never runs; its
# import-time check counts the host's NCCL network plugin as a second NCCL
# runtime, so EP_SUPPRESS_NCCL_CHECK skips that check.

[servers.sglang-gb200-8.environment]
CUDA_HOME = "/usr/local/cuda"
PATH = "${UNISERVE_MINIMAX_H3_SGLANG}/bin:/usr/local/cuda/bin:${PATH}"
SGLANG_RUST_BUILD_MODE = "never"
EP_SUPPRESS_NCCL_CHECK = "1"


