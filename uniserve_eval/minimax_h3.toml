# FastH3 OmniRef on the reference matrix, across two four-GB200 hosts as one
# eight-way Ulysses replica. References keep their own size unless they
# exceed their encoding size, the server's default. One
# deployment serves every cell: the 15-second range, a text capacity for each
# cell's prompt (3,410 to 23,874 tokens; a visual reference's vision tokens
# are prompt tokens) and the condition capacity of the largest composition
# (56,192 rows, nine square images and three 2-second clips with their
# soundtracks). The largest request, that composition at 15 s, packs 189,830
# sequence rows. The media reader publishes decoded references from a GPU
# rank, the text encoder runs on rank-0's four GPUs and the latent encoder
# deals condition units to the ranks the prompt leaves free, rank-1's GPUs
# first, so both hosts encode a request's conditions together.
[servers.gb200-8-omniref-refs]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = [".venv/bin/uniserve", "serve", "${UNISERVE_MINIMAX_H3_OMNIREF}", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--worker-python", ".venv/bin/python", "--workers", "configs/minimax_h3/ulysses8-reference-two-node.json", "--max-running-requests", "2", "--max-model-len", "24576", "--video-text-capacities", "4096,7168,8192,9216,10240,12288,15360", "--max-video-seconds", "15", "--max-condition-rows", "56192", "--media-directory", "${UNISERVE_MINIMAX_H3_INPUTS}", "--ffprobe", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--ffmpeg", "${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--host-identity", "rank-0", "--quantization-config", "{\"mode\":\"quality\"}"]

[servers.gb200-8-omniref-refs.environment]
NCCL_NVLS_ENABLE = "0"

