# BAGEL-7B-MoT serving topology for the single-GPU benchmark comparison.
#
# Stage 0 is the autoregressive Thinker and stage 1 is the DiT; both share GPU 0
# and hand off through shared memory.
#
# Capacity and numerics are held equal to the UniServe BAGEL benchmark server
# (`benchmark/server/bagel-uniserve`): 32 concurrent requests, an 8192-token
# per-step budget, prefix caching on the stage that owns the text KV cache, and
# captured CUDA graphs. Sampling is greedy with the benchmark seed so both
# runtimes perform the same generation work.
#
# The matrix sends text-to-image and image-to-text requests, so stage 0 declares
# a zero limit for the image-editing modality it never receives. Its per-step
# budget then only has to admit the 4900-token vision encoding of one input
# image, which this stage cannot split across steps.

async_chunk: false

stages:
  - stage_id: 0
    dtype: bfloat16
    max_num_batched_tokens: 8192
    limit_mm_per_prompt:
      img2img: 0
    max_num_seqs: 32
    gpu_memory_utilization: 0.45
    trust_remote_code: true
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      max_tokens: 8192
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

  - stage_id: 1
    dtype: bfloat16
    max_num_batched_tokens: 8192
    max_num_seqs: 32
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 42

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
