artifact_root = "artifacts/benchmark"

[servers.qwen]
host = "127.0.0.1"
port = 18081
command = ["target/release/uniserve", "serve", "${UNISERVE_QWEN3_MODEL}", "--model-description", "qwen3", "--served-model-name", "Qwen3-32B", "--host", "127.0.0.1", "--port", "18081", "--worker-python", ".venv/bin/python", "--max-total-tokens", "131072", "--max-running-requests", "128", "--max-num-batched-tokens", "16384", "--chunked-prefill-size", "16384", "--page-size", "64", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--kv-cache-dtype", "bfloat16", "--prefill-cuda-graph", "true", "--pipeline-depth", "4"]

[servers.qwen.environment]
CUDA_VISIBLE_DEVICES = "0"

[servers.sensenova]
host = "127.0.0.1"
port = 18082
command = ["target/release/uniserve", "serve", "${UNISERVE_SENSENOVA_MODEL}", "--model-description", "sensenova", "--served-model-name", "SenseNova-U1", "--host", "127.0.0.1", "--port", "18082", "--worker-python", ".venv/bin/python", "--max-running-requests", "32", "--max-num-batched-tokens", "8192", "--page-size", "64", "--mem-fraction-static", "0.70", "--dtype", "bfloat16", "--kv-cache-dtype", "bfloat16", "--prefill-cuda-graph", "true"]

[servers.sensenova.environment]
CUDA_VISIBLE_DEVICES = "0"

[benchmarks.qwen-uniserve-sharegpt-r16]
server = "qwen"
task = "text"
model = "Qwen3-32B"
dataset = "sharegpt"
dataset_revision = "192ab2185289094fc556ec8ce5ce1e8e587154ca"
tokenizer = "${UNISERVE_QWEN3_MODEL}"

[benchmarks.qwen-uniserve-sharegpt-r16.load]
num_prompts = 200
request_rate = 16.0
warmup_requests = 1
seed = 42

[benchmarks.qwen-uniserve-sharegpt-r16.sampling]
temperature = 0.0
top_p = 1.0
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0
sampling_seed = 42
ignore_eos = true
stream = true

[benchmarks.qwen-uniserve-sharegpt-r16.metrics]
output_throughput = "higher"
mean_ttft_ms = "lower"
mean_tpot_ms = "lower"

[benchmarks.qwen-uniserve-sharegpt-r32]
